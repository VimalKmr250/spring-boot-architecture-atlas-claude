<section class="slide" data-sec="Spring" data-title="spring-kafka overview">
  <h2>spring-kafka: the pieces and how they fit</h2>
  <p class="dek">Five objects do all the work. Knowing which one owns what makes the configuration obvious instead of magic.</p>

  <figure>
    <div class="figbox">
      <svg viewBox="0 0 880 216" role="img" aria-label="On the producing side KafkaTemplate wraps a ProducerFactory; on the consuming side a listener container factory creates message listener containers that poll and invoke annotated methods, with an error handler routing failures to a dead letter topic">
        <text x="14" y="16" font-size="10.5" font-weight="600" fill="currentColor" opacity="0.65">PRODUCING</text>
        <rect x="14" y="26" width="150" height="44" rx="7" fill="#D26A3F" fill-opacity="0.12" stroke="#D26A3F"></rect>
        <text x="89" y="46" text-anchor="middle" font-size="10.5" fill="currentColor">KafkaTemplate</text>
        <text x="89" y="61" text-anchor="middle" font-size="8.5" fill="currentColor" opacity="0.7">send, sendDefault, executeInTx</text>
        <rect x="192" y="26" width="150" height="44" rx="7" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.32"></rect>
        <text x="267" y="46" text-anchor="middle" font-size="10.5" fill="currentColor">ProducerFactory</text>
        <text x="267" y="61" text-anchor="middle" font-size="8.5" fill="currentColor" opacity="0.7">config + serializers</text>
        <line x1="166" y1="48" x2="188" y2="48" stroke="#8A94A3" stroke-width="1.3" marker-end="url(#arw)"></line>

        <text x="14" y="102" font-size="10.5" font-weight="600" fill="currentColor" opacity="0.65">CONSUMING</text>
        <rect x="14" y="112" width="160" height="44" rx="7" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.32"></rect>
        <text x="94" y="132" text-anchor="middle" font-size="10" fill="currentColor">ListenerContainerFactory</text>
        <text x="94" y="147" text-anchor="middle" font-size="8.5" fill="currentColor" opacity="0.7">concurrency, ack mode</text>
        <rect x="202" y="112" width="160" height="44" rx="7" fill="#D26A3F" fill-opacity="0.12" stroke="#D26A3F"></rect>
        <text x="282" y="132" text-anchor="middle" font-size="10" fill="currentColor">MessageListenerContainer</text>
        <text x="282" y="147" text-anchor="middle" font-size="8.5" fill="currentColor" opacity="0.7">the poll loop lives here</text>
        <rect x="390" y="112" width="140" height="44" rx="7" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.32"></rect>
        <text x="460" y="132" text-anchor="middle" font-size="10" fill="currentColor">@KafkaListener</text>
        <text x="460" y="147" text-anchor="middle" font-size="8.5" fill="currentColor" opacity="0.7">your method</text>
        <line x1="176" y1="134" x2="198" y2="134" stroke="#8A94A3" stroke-width="1.3" marker-end="url(#arw)"></line>
        <line x1="364" y1="134" x2="386" y2="134" stroke="#8A94A3" stroke-width="1.3" marker-end="url(#arw)"></line>

        <rect x="562" y="98" width="150" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.32"></rect>
        <text x="637" y="119" text-anchor="middle" font-size="10" fill="currentColor">DefaultErrorHandler</text>
        <rect x="562" y="142" width="150" height="34" rx="6" fill="#A22636" fill-opacity="0.10" stroke="#A22636"></rect>
        <text x="637" y="163" text-anchor="middle" font-size="10" fill="currentColor">DLT publisher</text>
        <line x1="532" y1="130" x2="558" y2="118" stroke="#A22636" stroke-width="1.3" marker-end="url(#arw)"></line>
        <line x1="637" y1="134" x2="637" y2="140" stroke="#A22636" stroke-width="1.3" marker-end="url(#arw)"></line>
        <text x="726" y="120" font-size="9.5" fill="currentColor" opacity="0.7">retries, then routes</text>
        <text x="726" y="136" font-size="9.5" fill="currentColor" opacity="0.7">the record aside so</text>
        <text x="726" y="152" font-size="9.5" fill="currentColor" opacity="0.7">the partition keeps</text>
        <text x="726" y="168" font-size="9.5" fill="currentColor" opacity="0.7">moving</text>

        <line x1="14" y1="192" x2="866" y2="192" stroke="currentColor" stroke-opacity="0.15"></line>
        <text x="14" y="210" font-size="10.5" fill="currentColor" opacity="0.8">The container owns the poll loop, threading, offsets and error routing — almost every consumer setting belongs on the container factory, not on your method.</text>
      </svg>
    </div>
    <figcaption>Boot auto-configures a <code>KafkaTemplate</code> and a default container factory from <code>spring.kafka.*</code> properties. You define your own factory only when you need per-listener behaviour — a different ack mode, a batch listener, or a separate error handler.</figcaption>
  </figure>
</section>
