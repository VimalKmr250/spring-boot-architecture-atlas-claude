<section class="slide" data-sec="Foundations" data-title="What actually changes">
  <h2>What actually changes when you go event-driven</h2>
  <p class="dek">Not "we added Kafka". The direction of knowledge reverses: the producer stops knowing who consumes it, which is the entire benefit and the source of every difficulty.</p>

  <figure>
    <div class="figbox">
      <svg viewBox="0 0 880 292" role="img" aria-label="Request-response: the order service calls payment, inventory, notification and search directly and must know all four. Event-driven: the order service publishes one event and consumers subscribe, so adding a fifth consumer does not change the producer">
        <text x="14" y="16" font-size="10.5" font-weight="600" fill="currentColor" opacity="0.65">REQUEST–RESPONSE — the producer knows every consumer</text>
        <rect x="14" y="52" width="110" height="46" rx="7" fill="#D26A3F" fill-opacity="0.12" stroke="#D26A3F"></rect>
        <text x="69" y="80" text-anchor="middle" font-size="11.5" fill="currentColor">order</text>
        <rect x="216" y="26" width="118" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.32"></rect>
        <text x="275" y="48" text-anchor="middle" font-size="10.5" fill="currentColor">payment</text>
        <rect x="216" y="68" width="118" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.32"></rect>
        <text x="275" y="90" text-anchor="middle" font-size="10.5" fill="currentColor">inventory</text>
        <rect x="216" y="110" width="118" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.32"></rect>
        <text x="275" y="132" text-anchor="middle" font-size="10.5" fill="currentColor">notification</text>
        <rect x="216" y="152" width="118" height="34" rx="6" fill="#A22636" fill-opacity="0.10" stroke="#A22636" stroke-dasharray="4 3"></rect>
        <text x="275" y="174" text-anchor="middle" font-size="10.5" fill="currentColor">search (new)</text>
        <line x1="126" y1="70" x2="212" y2="46" stroke="#D26A3F" stroke-width="1.4" marker-end="url(#arwA)"></line>
        <line x1="126" y1="76" x2="212" y2="86" stroke="#D26A3F" stroke-width="1.4" marker-end="url(#arwA)"></line>
        <line x1="126" y1="84" x2="212" y2="126" stroke="#D26A3F" stroke-width="1.4" marker-end="url(#arwA)"></line>
        <line x1="126" y1="92" x2="212" y2="168" stroke="#A22636" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arw)"></line>
        <text x="120" y="212" font-size="10" fill="#A22636">Adding search = a change, a test and a release of the ORDER service.</text>
        <text x="120" y="228" font-size="10" fill="#A22636">Four dependencies in the checkout path. Availability multiplies down.</text>

        <line x1="400" y1="20" x2="400" y2="244" stroke="currentColor" stroke-opacity="0.15"></line>

        <text x="424" y="16" font-size="10.5" font-weight="600" fill="currentColor" opacity="0.65">EVENT-DRIVEN — the producer knows nobody</text>
        <rect x="424" y="52" width="110" height="46" rx="7" fill="#D26A3F" fill-opacity="0.12" stroke="#D26A3F"></rect>
        <text x="479" y="74" text-anchor="middle" font-size="11.5" fill="currentColor">order</text>
        <text x="479" y="89" text-anchor="middle" font-size="8.5" fill="currentColor" opacity="0.65">commits, publishes</text>
        <rect x="562" y="46" width="112" height="58" rx="8" fill="#3AA79B" fill-opacity="0.14" stroke="#3AA79B"></rect>
        <text x="618" y="70" text-anchor="middle" font-size="11" fill="currentColor">orders.placed</text>
        <text x="618" y="87" text-anchor="middle" font-size="8.5" fill="currentColor" opacity="0.7">a durable, replayable log</text>
        <line x1="536" y1="75" x2="558" y2="75" stroke="#3AA79B" stroke-width="1.6" marker-end="url(#arwB)"></line>
        <rect x="712" y="20" width="120" height="30" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.32"></rect>
        <text x="772" y="40" text-anchor="middle" font-size="10" fill="currentColor">payment</text>
        <rect x="712" y="58" width="120" height="30" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.32"></rect>
        <text x="772" y="78" text-anchor="middle" font-size="10" fill="currentColor">inventory</text>
        <rect x="712" y="96" width="120" height="30" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.32"></rect>
        <text x="772" y="116" text-anchor="middle" font-size="10" fill="currentColor">notification</text>
        <rect x="712" y="134" width="120" height="30" rx="6" fill="#2C7448" fill-opacity="0.12" stroke="#2C7448"></rect>
        <text x="772" y="154" text-anchor="middle" font-size="10" fill="currentColor">search (new)</text>
        <line x1="678" y1="66" x2="708" y2="36" stroke="#3AA79B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arwB)"></line>
        <line x1="678" y1="72" x2="708" y2="74" stroke="#3AA79B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arwB)"></line>
        <line x1="678" y1="80" x2="708" y2="112" stroke="#3AA79B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arwB)"></line>
        <line x1="678" y1="88" x2="708" y2="150" stroke="#2C7448" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arwB)"></line>
        <text x="424" y="212" font-size="10" fill="#2C7448">Adding search = deploy a new consumer. The order service is not touched, not</text>
        <text x="424" y="228" font-size="10" fill="#2C7448">tested, not released. It can even replay history to backfill its index.</text>

        <line x1="14" y1="248" x2="866" y2="248" stroke="currentColor" stroke-opacity="0.15"></line>
        <text x="14" y="264" font-size="10.5" fill="currentColor" opacity="0.8">The cost: nobody can read the order service and see what happens when an order is placed. That knowledge now lives</text>
        <text x="14" y="282" font-size="10.5" fill="currentColor" opacity="0.8">in the topology, the traces, and a catalogue you must maintain.</text>
      </svg>
    </div>
    <figcaption>This is the whole trade in one picture. You are buying <b>independent evolution</b> and paying in <b>traceability</b>. Every practice in this tab — naming, cataloguing, tracing, replay tooling — exists to buy some of that traceability back.</figcaption>
  </figure>
</section>
