<section class="slide" data-sec="Frontend" data-title="Frontend architecture">
  <h2>The frontend is three tiers too</h2>
  <p class="dek">"SPA calls API" hides every decision that matters: where the session lives, who aggregates, what is rendered where, and how the contract stays in sync.</p>

  <figure>
    <div class="figbox">
      <svg viewBox="0 0 880 282" role="img" aria-label="Browser running an Angular SPA with a feature-based structure talks to a BFF over a session cookie; the BFF holds the OIDC tokens and calls the API gateway with a bearer token; static assets come from a CDN">
        <rect x="14" y="30" width="230" height="196" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.3"></rect>
        <text x="129" y="52" text-anchor="middle" font-size="12.5" font-weight="600" fill="currentColor">Browser</text>
        <rect x="32" y="66" width="194" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.3"></rect>
        <text x="129" y="87" text-anchor="middle" font-size="10.5" fill="currentColor">routes: lazily loaded per feature</text>
        <rect x="32" y="108" width="194" height="34" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.3"></rect>
        <text x="129" y="129" text-anchor="middle" font-size="10.5" fill="currentColor">state: signals / store per feature</text>
        <rect x="32" y="150" width="194" height="34" rx="6" fill="#D26A3F" fill-opacity="0.12" stroke="#D26A3F"></rect>
        <text x="129" y="171" text-anchor="middle" font-size="10.5" fill="currentColor">generated API client (OpenAPI)</text>
        <text x="129" y="204" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.6">no tokens in localStorage — see the auth slide</text>

        <rect x="326" y="18" width="180" height="46" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35"></rect>
        <text x="416" y="38" text-anchor="middle" font-size="11.5" fill="currentColor">CDN</text>
        <text x="416" y="54" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.65">hashed JS/CSS, immutable, 1y</text>
        <line x1="246" y1="70" x2="322" y2="48" stroke="#8A94A3" stroke-width="1.4" marker-end="url(#arw)"></line>

        <rect x="326" y="100" width="180" height="72" rx="8" fill="#D26A3F" fill-opacity="0.12" stroke="#D26A3F"></rect>
        <text x="416" y="124" text-anchor="middle" font-size="12" fill="currentColor">BFF</text>
        <text x="416" y="142" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.7">holds tokens · sets session cookie</text>
        <text x="416" y="158" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.7">aggregates the checkout screen</text>
        <line x1="246" y1="150" x2="322" y2="136" stroke="#D26A3F" stroke-width="1.6" marker-end="url(#arwA)"></line>
        <text x="284" y="128" text-anchor="middle" font-size="9" fill="#D26A3F">cookie</text>
        <text x="284" y="140" text-anchor="middle" font-size="9" fill="#D26A3F">SameSite</text>

        <rect x="574" y="100" width="150" height="72" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35"></rect>
        <text x="649" y="130" text-anchor="middle" font-size="11.5" fill="currentColor">API gateway</text>
        <text x="649" y="148" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.65">+ order platform</text>
        <line x1="508" y1="136" x2="570" y2="136" stroke="#8A94A3" stroke-width="1.4" marker-end="url(#arw)"></line>
        <text x="539" y="128" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.65">Bearer</text>

        <rect x="574" y="18" width="150" height="46" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35"></rect>
        <text x="649" y="38" text-anchor="middle" font-size="11.5" fill="currentColor">Identity provider</text>
        <text x="649" y="54" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.65">OIDC · Keycloak / Entra</text>
        <line x1="440" y1="98" x2="600" y2="66" stroke="#8A94A3" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arw)"></line>
        <text x="516" y="80" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">auth code + PKCE</text>

        <text x="756" y="120" font-size="10.5" fill="currentColor" opacity="0.7">One contract,</text>
        <text x="756" y="136" font-size="10.5" fill="currentColor" opacity="0.7">two generated</text>
        <text x="756" y="152" font-size="10.5" fill="currentColor" opacity="0.7">clients, zero</text>
        <text x="756" y="168" font-size="10.5" fill="currentColor" opacity="0.7">hand-written DTOs.</text>

        <line x1="14" y1="240" x2="866" y2="240" stroke="currentColor" stroke-opacity="0.12"></line>
        <text x="14" y="254" font-size="10.5" fill="currentColor" opacity="0.65">Add SSR only for pages that must be indexed, or that carry a measured LCP problem — it doubles</text>
        <text x="14" y="271" font-size="10.5" fill="currentColor" opacity="0.65">your runtime surface: a Node process to operate, hydrate and debug.</text>
      </svg>
    </div>
    <figcaption>The copper path is the one that carries the user's identity. Keeping it a cookie between browser and BFF, and a bearer token only server-side, is what removes token theft via XSS from the threat model entirely.</figcaption>
  </figure>
</section>
